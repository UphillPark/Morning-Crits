name: Sync claude branch to main

on:
  schedule:
    - cron: '7 * * * *'      # hourly at :07 (UTC)
  workflow_dispatch: {}       # manual run button
  push:
    branches: ['claude/**']   # runs on push if the branch carries this file

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge latest claude/* branch into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BR=$(git for-each-ref --sort=-committerdate --count=1 \
                 --format='%(refname:short)' 'refs/remotes/origin/claude/*')
          if [ -z "$BR" ]; then echo "no claude/* branch"; exit 0; fi

          if git merge-base --is-ancestor "$BR" HEAD; then
            echo "main already contains $BR"; exit 0
          fi

          git merge --no-edit -X theirs -m "Sync $BR into main" "$BR"
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
